<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PALETTE LOG</title>

  <!-- スマホの「ホーム画面に追加」でアプリっぽく開くための設定 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f0f10">

  <!-- 文字：欧文はCormorant、和文見出しはしっぽり明朝、本文は禅角ゴシック -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">

  <link rel="stylesheet" href="style.css">
</head>
<body>
<!--
  =========================================================
  index.html ― 画面の「骨組み」だけを書くファイル
  ---------------------------------------------------------
  ・ギャラリー（一覧）と、作品詳細（上に重なる画面）の2つでできています。
  ・id="..." は JavaScript から探すための名前なので、変えないでください。
  ・アプリ名は js/config.js の APP_NAME で変えられます（ここの <title> も自動で変わる）。
  =========================================================
-->

<header class="top">
  <div class="brand">
    <h1 id="app-name" class="app-name">PALETTE LOG</h1>
    <p id="count" class="count"></p>
  </div>
  <div class="top-actions">
    <button type="button" id="sort" class="btn-text" aria-label="並び順を切り替える">
      <span id="sort-label">新しい順</span>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M2 10l3 3 3-3M11 13V3M8 6l3-3 3 3"/></svg>
    </button>
    <button type="button" id="add" class="btn-line">＋ 追加</button>
  </div>
</header>

<!-- 絞り込み：黒猫 ｜ 暖色・寒色… ｜ 低彩度… ｜ 暗い… ｜ 青系… -->
<div id="controls" class="controls" hidden>
  <div id="filters" class="filters" role="group" aria-label="絞り込み"></div>
  <button type="button" id="clear-filter" class="btn-text clear" hidden>解除</button>
</div>

<main>
  <!-- 作品が1つもないとき -->
  <div id="empty" class="empty" hidden>
    <p class="empty-title">まだ作品がない。</p>
    <p class="empty-text">画像をこの画面にドラッグするか、ここから選ぶ。<br>JPEG・PNG・WebP など。まとめて100枚でも大丈夫。</p>
    <button type="button" id="empty-add" class="btn-line">画像を選ぶ</button>
  </div>

  <!-- 絞り込みで0件のとき -->
  <p id="no-match" class="no-match" hidden>この条件の作品はない。</p>

  <!-- ギャラリー本体（js/gallery.js が中身を作る） -->
  <div id="gallery" class="gallery"></div>
</main>

<!-- ===================== 作品詳細 ===================== -->
<div id="detail" class="detail" role="dialog" aria-modal="true" aria-label="作品の詳細" hidden>
  <div class="detail-bar">
    <button type="button" id="d-close" class="btn-icon" aria-label="閉じる">×</button>
    <span id="d-count" class="d-count"></span>
    <div class="d-nav">
      <button type="button" id="d-prev" class="btn-icon" aria-label="前の作品">‹</button>
      <button type="button" id="d-next" class="btn-icon" aria-label="次の作品">›</button>
    </div>
  </div>

  <div class="detail-body">
    <!-- 作品（黒猫はここの隅に座る） -->
    <figure class="d-figure">
      <div id="d-frame" class="d-frame">
        <img id="d-img" alt="">
      </div>
    </figure>

    <div class="d-info">
      <!-- 黒猫 -->
      <button type="button" id="d-cat" class="d-cat" aria-pressed="false">
        <span class="cat-slot"></span>
        <span id="d-cat-label">黒猫を座らせる</span>
      </button>

      <!-- 制作日 -->
      <section class="d-section">
        <h2 class="label">DATE</h2>
        <p class="d-date-row">
          <span id="d-date" class="d-date"></span>
          <span id="d-source" class="source"></span>
        </p>
        <p id="d-source-note" class="note"></p>
        <button type="button" id="d-date-edit" class="btn-text small">制作日を変える</button>

        <form id="d-date-form" class="d-date-form" hidden>
          <label for="d-date-input" class="visually-hidden">制作日</label>
          <input id="d-date-input" type="date" class="field">
          <div class="row">
            <button type="submit" class="btn-line small">この日にする</button>
            <button type="button" id="d-date-unknown" class="btn-text small">不明にする</button>
            <button type="button" id="d-date-auto" class="btn-text small">自動に戻す</button>
            <button type="button" id="d-date-cancel" class="btn-text small">やめる</button>
          </div>
          <p id="d-auto-note" class="note"></p>
        </form>
      </section>

      <!-- 色 -->
      <section id="d-metrics" class="d-section">
        <h2 class="label">COLOR PALETTE</h2>
        <div id="d-band" class="band" aria-hidden="true"></div>
        <ul id="d-swatches" class="swatches"></ul>

        <dl class="metrics">
          <div>
            <dt>明度</dt>
            <dd><span id="d-bright-v" class="num"></span><span class="meter"><span id="d-bright-bar"></span></span></dd>
          </div>
          <div>
            <dt>彩度</dt>
            <dd><span id="d-sat-v" class="num"></span><span class="meter"><span id="d-sat-bar"></span></span></dd>
          </div>
          <div>
            <dt>色温度</dt>
            <dd id="d-temp"></dd>
          </div>
          <div>
            <dt>色系</dt>
            <dd id="d-hues"></dd>
          </div>
        </dl>
      </section>

      <section class="d-section">
        <p id="d-file" class="note file"></p>
        <button type="button" id="d-delete" class="btn-text small danger">削除</button>
      </section>
    </div>
  </div>
</div>

<!-- 取り込み中の表示 -->
<div id="progress" class="progress" hidden>
  <span id="progress-text"></span>
  <span class="progress-track"><span id="progress-fill"></span></span>
</div>

<!-- ドラッグ中の表示 -->
<div id="drop" class="drop" hidden>
  <p>ここに落とす</p>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<!-- 画像を選ぶための見えない部品（複数選択OK） -->
<input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif,image/*" multiple hidden>

<!-- 読み込む順番が大事：設定 → 保存 → 解析 → 表示 → 全体の流れ -->
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/date-reader.js"></script>
<script src="js/color.js"></script>
<script src="js/model.js"></script>
<script src="js/filters.js"></script>
<script src="js/cat.js"></script>
<script src="js/importer.js"></script>
<script src="js/gallery.js"></script>
<script src="js/detail.js"></script>
<script src="js/app.js"></script>
</body>
</html>
